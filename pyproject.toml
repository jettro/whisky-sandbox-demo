[project]
name = "whisky-sandbox-demo"
version = "0.1.0"
description = "Whisky blind-tasting planner comparing tool calls, Monty Code Mode and a Smol sandbox"
readme = "README.md"
authors = [
    { name = "Jettro Coenradie", email = "jettro@coenradie.com" }
]
requires-python = ">=3.12"
dependencies = [
    "logfire>=5.6.0",
    "pydantic-ai-harness[codemode,smol]==0.68.0",
    "pydantic-ai-slim[openai]==2.68.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
whisky-sandbox-demo = "whisky_sandbox_demo:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["output", "guest"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs OpenAI credentials or a Smol VM (deselect with -m 'not integration')"]
addopts = "-m 'not integration'"
